name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish RankPine Strapi plugin to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: >-
          node -e "process.exit('v' + require('./package.json').version === process.env.RELEASE_TAG ? 0 : 1)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate package
        run: npm run validate

      - name: Verify Plugin SDK exports
        run: npm run verify

      - name: Publish to npm
        run: npm publish --provenance --access public
